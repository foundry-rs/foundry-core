[package]
name = "foundry-fork-db"
description = "Fork database used by Foundry"
version = "0.27.0"

edition.workspace = true
rust-version = "1.96"
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
zstd = ["dep:zstd"]

[dependencies]
alloy-chains = { workspace = true, features = ["serde"] }
alloy-consensus.workspace = true
alloy-primitives = { workspace = true, features = ["map"] }
alloy-provider = { version = "2.2.0", default-features = false }
alloy-rpc-types = { version = "2.2.0", features = ["eth"] }

eyre.workspace = true
futures = "0.3.32"

parking_lot = "0.12.5"

evm2 = { git = "https://github.com/mablr/evm2", rev = "2632660d8b641b7ddd5929bc6221bc1bce959806", default-features = false, features = ["std", "serde"] }

serde.workspace = true
serde_json.workspace = true

thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing.workspace = true

url = "2.5.8"
zstd = { version = "0.14.0", optional = true }

[dev-dependencies]
alloy-rpc-client = "2.2.0"
tempfile.workspace = true
tiny_http = "0.12.0"
