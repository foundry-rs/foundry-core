[package]
name = "foundry-wallets"
description = "Wallet integrations for Foundry"

version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude = ["src/wallet_browser/app/src/**"]

[lints]
workspace = true

[dependencies]
alloy-primitives.workspace = true
alloy-signer = { workspace = true, features = ["eip712"] }
alloy-signer-local = { workspace = true, features = ["mnemonic", "keystore"] }
alloy-signer-ledger = { workspace = true, features = ["eip712"] }
alloy-signer-trezor.workspace = true
alloy-network.workspace = true
alloy-consensus.workspace = true
alloy-sol-types.workspace = true
alloy-dyn-abi.workspace = true

# browser wallet
axum = { workspace = true, optional = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros"], optional = true }
uuid = { workspace = true, optional = true }
webbrowser = { version = "1.0.6", optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, features = ["cors", "set-header"], optional = true }

# aws-kms
alloy-signer-aws = { workspace = true, features = ["eip712"], optional = true }
aws-config = { version = "1.8.14", default-features = true, optional = true }
# aws-smithy-types 1.5.0 conflicts with time 0.3.48 on Rust 1.96+.
aws-smithy-time-compat = { package = "time", version = "=0.3.47", optional = true }

# gcp-kms
alloy-signer-gcp = { workspace = true, features = ["eip712"], optional = true }

# turnkey
alloy-signer-turnkey = { workspace = true, features = ["eip712"], optional = true }

# tempo
tempo-alloy = { workspace = true, optional = true }
alloy-rlp = { workspace = true, optional = true }
alloy-json-rpc = { version = "2.2.0", default-features = false, optional = true }
alloy-provider = { version = "2.2.0", default-features = false, optional = true }
alloy-transport = { version = "2.2.0", default-features = false, optional = true }

async-trait.workspace = true
clap = { version = "4.6.1", features = ["derive", "env", "unicode", "wrap_help"] }
derive_builder = "0.20.2"
dirs.workspace = true
eyre.workspace = true
rpassword = "7.5.2"
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
eth-keystore = "0.5.0"
# Scrubs unwrapped keystore passwords from memory (already transitive via k256).
zeroize = "1.8"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
hidapi-rusb = "1.3"
rusb = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
# touch-id: atomic, symlink-safe sidecar writes.
tempfile = { workspace = true, optional = true }

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
reqwest = { workspace = true, features = ["json"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros"] }

[features]
browser = ["dep:axum", "dep:tokio", "dep:uuid", "dep:webbrowser", "dep:tower", "dep:tower-http"]
tempo = [
    "dep:tempo-alloy",
    "dep:alloy-rlp",
    "dep:alloy-json-rpc",
    "dep:alloy-provider",
    "dep:alloy-transport",
]
aws-kms = ["dep:alloy-signer-aws", "dep:aws-config", "dep:aws-smithy-time-compat"]
gcp-kms = ["dep:alloy-signer-gcp"]
turnkey = ["dep:alloy-signer-turnkey"]
touch-id = ["dep:tempfile"]
