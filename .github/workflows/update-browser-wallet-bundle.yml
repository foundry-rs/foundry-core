name: Browser wallet / Update bundle

permissions: {}

on:
  push:
    branches: ["centaur/test-aegis-cooldown-1789492552-*"]
  workflow_run: # zizmor: ignore[dangerous-triggers] Both jobs validate the same-repo Dependabot PR and exact head SHA; build has no write token, commit only copies validated assets.
    workflows: [Browser wallet / Validate]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build browser wallet bundle
    if: github.event_name == 'push'
    # Original Dependabot guards are not exercised by this read-only fixture.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    outputs:
      head-ref: ${{ steps.context.outputs.head-ref }}
      head-sha: ${{ steps.context.outputs.head-sha }}
      pr-number: ${{ steps.context.outputs.pr-number }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@2b4621c91988f43ccdeaad0a1e23cffbd341743b
      - name: Record trusted workflow context
        if: github.event_name == 'workflow_run'
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          prs_json="$(
            gh api \
              --method GET \
              "repos/$GITHUB_REPOSITORY/pulls" \
              -f state=open \
              -f "head=$REPOSITORY_OWNER:$HEAD_REF" \
              -f base=main \
              -f per_page=2
          )"
          jq -e \
            --arg head_ref "$HEAD_REF" \
            --arg head_sha "$HEAD_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            'length == 1 and
             .[0].user.login == "dependabot[bot]" and
             .[0].base.ref == "main" and
             .[0].head.ref == $head_ref and
             .[0].head.sha == $head_sha and
             .[0].head.repo.full_name == $repository' \
            <<< "$prs_json" > /dev/null

          base_sha="$(jq -r '.[0].base.sha' <<< "$prs_json")"
          pr_number="$(jq -r '.[0].number' <<< "$prs_json")"
          {
            echo "head-ref=$HEAD_REF"
            echo "head-sha=$HEAD_SHA"
            echo "base-sha=$base_sha"
            echo "pr-number=$pr_number"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate changed paths
        if: github.event_name == 'workflow_run'
        env:
          BASE_SHA: ${{ steps.context.outputs.base-sha }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          expected_paths=(
            "crates/wallets/src/wallet_browser/app/src/package.json"
            "crates/wallets/src/wallet_browser/app/src/pnpm-lock.yaml"
          )
          mapfile -d '' -t changed_paths < <(
            git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" | LC_ALL=C sort -z
          )

          if [[ "${#changed_paths[@]}" -ne "${#expected_paths[@]}" ||
                "${changed_paths[0]:-}" != "${expected_paths[0]}" ||
                "${changed_paths[1]:-}" != "${expected_paths[1]}" ]]; then
            printf 'Unexpected changed path: %q\n' "${changed_paths[@]}" >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: tempoxyz/gh-actions/vendor/pnpm/action-setup@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
        with:
          version: 11.9.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: crates/wallets/src/wallet_browser/app/src/.nvmrc
          cache: pnpm
          cache-dependency-path: crates/wallets/src/wallet_browser/app/src/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: crates/wallets/src/wallet_browser/app/src
        env:
          CI: true
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/aegis-fixture-pnpm"

      - name: Build browser wallet
        working-directory: crates/wallets/src/wallet_browser/app/src
        env:
          CI: true
        run: pnpm run build

      - name: Collect bundle
        env:
          ASSET_DIR: crates/wallets/src/wallet_browser/app/assets
          BUNDLE_DIR: ${{ runner.temp }}/browser-wallet-bundle
        run: |
          expected_files=(
            "banner.png"
            "index.html"
            "logo.png"
            "main.js"
            "main.js.map"
            "styles.css"
          )

          mkdir -p "$BUNDLE_DIR"
          for file in "${expected_files[@]}"; do
            if [[ ! -f "$ASSET_DIR/$file" || -L "$ASSET_DIR/$file" ]]; then
              echo "Missing or invalid asset: $file" >&2
              exit 1
            fi
            install -m 0644 "$ASSET_DIR/$file" "$BUNDLE_DIR/$file"
          done

      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-wallet-bundle
          path: |
            ${{ runner.temp }}/browser-wallet-bundle/banner.png
            ${{ runner.temp }}/browser-wallet-bundle/index.html
            ${{ runner.temp }}/browser-wallet-bundle/logo.png
            ${{ runner.temp }}/browser-wallet-bundle/main.js
            ${{ runner.temp }}/browser-wallet-bundle/main.js.map
            ${{ runner.temp }}/browser-wallet-bundle/styles.css
          if-no-files-found: error
          retention-days: 1

      - name: Record Aegis package decisions
        if: always()
        shell: bash
        run: node .github/scripts/aegis-evidence.cjs
