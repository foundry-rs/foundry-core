name: nightly

permissions: {}

on:
  pull_request: # Validate nightly coverage on this stacked draft, too.
  schedule:
    - cron: "0 2 * * *" # Run daily at 2 AM UTC
  workflow_dispatch: # Needed so we can run it manually

concurrency:
  group: tests-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  RUSTC_WRAPPER: "sccache"

jobs:
  test:
    name: nightly tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      NODE_OPTIONS: --no-network-family-autoselection
      SFW_UNKNOWN_HOST_ACTION: ignore
      SFW_CUSTOM_REGISTRIES: wrap:binaries.soliditylang.org,wrap:raw.githubusercontent.com/nikitastupin/solc,wrap:raw.githubusercontent.com/alloy-rs/solc-builds,wrap:api.etherscan.io,wrap:eth.blockscout.com
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@6e62935eb0bfeac202d19c425f742dc1dcd88f5d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
        with:
          toolchain: stable
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
      # Keep the cache daemon outside Socket's per-command proxy environment.
      - run: sccache --start-server
      - uses: tempoxyz/gh-actions/vendor/Swatinem/rust-cache@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
      - name: Install nextest
        uses: tempoxyz/gh-actions/vendor/taiki-e/install-action@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
        with:
          tool: nextest@0.9.140
          checksum: true
          fallback: none
      - name: Fetch nextest dependencies through Socket
        run: bash .github/scripts/nextest-offline.sh fetch
      - name: Test (offline Cargo)
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: bash .github/scripts/nextest-offline.sh test --all-features --no-fail-fast --ignore-default-filter

  issue:
    name: Open an issue
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name != 'pull_request' && failure()
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/JasonEtco/create-an-issue@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_URL: |
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          update_existing: true
          filename: .github/NIGHTLY_TEST_FAILURE_TEMPLATE.md
