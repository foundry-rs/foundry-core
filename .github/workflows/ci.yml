name: CI

permissions: {}

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  RUSTC_WRAPPER: "sccache"

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      NODE_OPTIONS: --no-network-family-autoselection
      SFW_UNKNOWN_HOST_ACTION: ignore
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@6e62935eb0bfeac202d19c425f742dc1dcd88f5d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
        with:
          toolchain: nightly
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # macOS covers the target-gated `touch-id` code, which the Linux leg
        # never compiles.
        os: ["ubuntu-latest", "macos-latest"]
    env:
      NODE_OPTIONS: --no-network-family-autoselection
      SFW_UNKNOWN_HOST_ACTION: ignore
      SFW_CUSTOM_REGISTRIES: ${{ matrix.os == 'ubuntu-latest' && 'wrap:binaries.soliditylang.org,wrap:raw.githubusercontent.com/nikitastupin/solc,wrap:raw.githubusercontent.com/alloy-rs/solc-builds' || 'bypass:binaries.soliditylang.org,bypass:raw.githubusercontent.com' }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@6e62935eb0bfeac202d19c425f742dc1dcd88f5d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
        with:
          toolchain: nightly
          components: clippy
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
      # Keep the cache daemon outside Socket's per-command proxy environment.
      - run: sccache --start-server
      - uses: tempoxyz/gh-actions/vendor/Swatinem/rust-cache@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
      - run: cargo clippy --workspace --all-targets --all-features --locked
        env:
          RUSTFLAGS: -Dwarnings

  # The `touch-id` Swift shim must compile and link for both shipped Apple
  # targets, on both the oldest supported toolchain and the latest — the
  # host-arch test leg only ever links one combination. `--no-run` still
  # performs the final binary link (Swift static lib, runtime search paths,
  # framework autolinking), which `cargo check`/`clippy` never exercise, while
  # the x86_64 binaries simply aren't executed on the arm64 runners.
  #
  # The oldest leg pins the documented toolchain floor (Xcode 15.0.1,
  # Swift 5.9 — see `MIN_SWIFT` in crates/wallets/build.rs).
  # If the runner image drops that Xcode, the pin step fails loudly so the
  # floor is re-evaluated instead of silently sliding forward.
  touch-id-link:
    runs-on: ${{ matrix.toolchain.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      NODE_OPTIONS: --no-network-family-autoselection
      SFW_UNKNOWN_HOST_ACTION: ignore
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    strategy:
      fail-fast: false
      matrix:
        target: ["x86_64-apple-darwin", "aarch64-apple-darwin"]
        toolchain:
          - { xcode: "15.0.1", os: "macos-14" }
          - { xcode: "latest", os: "macos-latest" }
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@6e62935eb0bfeac202d19c425f742dc1dcd88f5d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pin oldest supported Xcode
        if: matrix.toolchain.xcode != 'latest'
        run: |
          app="/Applications/Xcode_${{ matrix.toolchain.xcode }}.app"
          if [ ! -d "$app" ]; then
            echo "::error::runner image no longer ships Xcode ${{ matrix.toolchain.xcode }}; re-evaluate the documented touch-id toolchain floor (MIN_SWIFT in crates/wallets/build.rs)"
            exit 1
          fi
          echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
      # Keep the cache daemon outside Socket's per-command proxy environment.
      - run: sccache --start-server
      - uses: tempoxyz/gh-actions/vendor/Swatinem/rust-cache@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
        with:
          key: ${{ matrix.toolchain.xcode }}
      - run: swiftc --version
      - name: Observe Cargo output descriptors on macOS
        run: |
          diag_dir="$RUNNER_TEMP/cargo-io-diagnostics"
          mkdir -p "$diag_dir/bin"
          clang -std=c11 -Wall -Wextra -dynamiclib .github/scripts/cargo-io-observer.c -o "$diag_dir/observer.dylib"
          clang -std=c11 -Wall -Wextra .github/scripts/cargo-io-probe.c -o "$diag_dir/bin/cargo"
          echo "DIAG_REAL_CARGO=$(rustup which cargo)" >> "$GITHUB_ENV"
          echo "DIAG_IO_LIBRARY=$diag_dir/observer.dylib" >> "$GITHUB_ENV"
          echo "$diag_dir/bin" >> "$GITHUB_PATH"
      - name: compile and link touch-id test binaries
        run: |
          artifacts="$RUNNER_TEMP/touch-id-artifacts.json"
          executables="$RUNNER_TEMP/touch-id-executables"
          cargo test -p foundry-wallets --features touch-id --target ${{ matrix.target }} \
            --locked --no-run --message-format=json > "$artifacts"
          jq -r \
            'select(.reason == "compiler-artifact" and .profile.test and .executable != null) | .executable' \
            "$artifacts" > "$executables"
          test -s "$executables"
          while IFS= read -r executable; do
            minos="$(xcrun vtool -show-build "$executable" | awk '$1 == "minos" { print $2; exit }')"
            if [[ ! "$minos" =~ ^11(\.0){0,2}$ ]]; then
              echo "::error file=$executable::expected macOS deployment target 11.0, found ${minos:-none}"
              exit 1
            fi
          done < "$executables"
      - name: Show compiler errors captured in Cargo JSON
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/touch-id-artifacts.json" ]; then
            jq -r 'select(.reason == "compiler-message") | .message.rendered // empty' "$RUNNER_TEMP/touch-id-artifacts.json"
          fi
      - name: Repeat the affected Cargo JSON path for diagnostics
        if: always() && matrix.target == 'x86_64-apple-darwin' && matrix.toolchain.xcode == '15.0.1'
        run: |
          status=0
          for attempt in 1 2 3; do
            echo "IO_DIAGNOSTIC attempt=$attempt"
            if cargo test -p foundry-wallets --features touch-id --target x86_64-apple-darwin \
              --locked --no-run --message-format=json > "$RUNNER_TEMP/touch-id-repeat-$attempt.json"; then
              echo "IO_DIAGNOSTIC attempt=$attempt status=0"
            else
              code=$?
              echo "IO_DIAGNOSTIC attempt=$attempt status=$code"
              status=$code
            fi
          done
          exit "$status"

  feature-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      NODE_OPTIONS: --no-network-family-autoselection
      SFW_UNKNOWN_HOST_ACTION: ignore
      SFW_CUSTOM_REGISTRIES: wrap:binaries.soliditylang.org,wrap:raw.githubusercontent.com/nikitastupin/solc,wrap:raw.githubusercontent.com/alloy-rs/solc-builds
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@6e62935eb0bfeac202d19c425f742dc1dcd88f5d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
        with:
          toolchain: stable
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
      # Keep the cache daemon outside Socket's per-command proxy environment.
      - run: sccache --start-server
      - uses: tempoxyz/gh-actions/vendor/Swatinem/rust-cache@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
      - name: Install cargo-hack
        run: cargo install --locked --version 0.6.45 cargo-hack
      - name: cargo hack
        run: cargo hack check --feature-powerset --depth 1 --locked

  test:
    name: test ${{ matrix.rust }} ${{ matrix.flags }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # Exercise main's full matrix while validating the shared Socket guard.
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        rust: ["stable", "1.95"]
        flags: ["", "--all-features"]
        exclude:
          # Skip because some features have higher MSRV.
          - rust: "1.95" # MSRV
            flags: "--all-features"
    env:
      NODE_OPTIONS: --no-network-family-autoselection
      SFW_UNKNOWN_HOST_ACTION: ignore
      SFW_CUSTOM_REGISTRIES: ${{ matrix.os == 'ubuntu-latest' && 'wrap:binaries.soliditylang.org,wrap:raw.githubusercontent.com/nikitastupin/solc,wrap:raw.githubusercontent.com/alloy-rs/solc-builds' || 'bypass:binaries.soliditylang.org,bypass:raw.githubusercontent.com' }},wrap:api.etherscan.io,wrap:eth.blockscout.com
      # Socket proxy certificates lack revocation endpoints; retain TLS validation.
      CARGO_HTTP_CHECK_REVOKE: ${{ matrix.os == 'windows-latest' && 'false' || 'true' }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@6e62935eb0bfeac202d19c425f742dc1dcd88f5d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
        with:
          toolchain: ${{ matrix.rust }}
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
      # Keep the cache daemon outside Socket's per-command proxy environment.
      - run: sccache --start-server
      - uses: tempoxyz/gh-actions/vendor/Swatinem/rust-cache@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
      - name: Select Cargo's bin directory for the Windows installer
        if: runner.os == 'Windows'
        run: |
          # Taiki installs beside the first cargo on PATH; avoid Socket's shim
          # directory. The next Bash step refreshes Socket interception again.
          cargo_bin="$(cygpath -u "${CARGO_HOME:-$USERPROFILE/.cargo}")/bin"
          test -x "$cargo_bin/cargo.exe"
          cygpath -w "$cargo_bin" >> "$GITHUB_PATH"
      - name: Install nextest
        uses: tempoxyz/gh-actions/vendor/taiki-e/install-action@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
        with:
          tool: nextest@0.9.140
          checksum: true
          fallback: none
      - name: test
        run: cargo nextest run --workspace --locked ${{ matrix.flags }}
        env:
          # Diagnostic control: restore Node address fallback only on the failing leg.
          NODE_OPTIONS: ${{ runner.os == 'macOS' && matrix.flags == '--all-features' && '--network-family-autoselection' || '--no-network-family-autoselection' }}
      - name: Compare registry addresses after the package operation
        if: always() && matrix.flags == '--all-features' && runner.os != 'Windows'
        run: node .github/scripts/registry-network-diagnostics.cjs

  doctest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      NODE_OPTIONS: --no-network-family-autoselection
      SFW_UNKNOWN_HOST_ACTION: ignore
      SFW_CUSTOM_REGISTRIES: wrap:binaries.soliditylang.org,wrap:raw.githubusercontent.com/nikitastupin/solc,wrap:raw.githubusercontent.com/alloy-rs/solc-builds
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@6e62935eb0bfeac202d19c425f742dc1dcd88f5d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
        with:
          toolchain: stable
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
      # Keep the cache daemon outside Socket's per-command proxy environment.
      - run: sccache --start-server
      - uses: tempoxyz/gh-actions/vendor/Swatinem/rust-cache@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
      - run: cargo test --workspace --doc --all-features --locked

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      NODE_OPTIONS: --no-network-family-autoselection
      SFW_UNKNOWN_HOST_ACTION: ignore
      SFW_CUSTOM_REGISTRIES: wrap:binaries.soliditylang.org,wrap:raw.githubusercontent.com/nikitastupin/solc,wrap:raw.githubusercontent.com/alloy-rs/solc-builds
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@6e62935eb0bfeac202d19c425f742dc1dcd88f5d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
        with:
          toolchain: nightly
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
      # Keep the cache daemon outside Socket's per-command proxy environment.
      - run: sccache --start-server
      - uses: tempoxyz/gh-actions/vendor/Swatinem/rust-cache@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
      - run: cargo doc --workspace --all-features --no-deps --document-private-items --locked
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings --show-type-layout --generate-link-to-definition --enable-index-page -Zunstable-options

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      NODE_OPTIONS: --no-network-family-autoselection
      SFW_UNKNOWN_HOST_ACTION: ignore
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@6e62935eb0bfeac202d19c425f742dc1dcd88f5d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/actions/typos@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f

  deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      RUSTC_WRAPPER: ""
      NODE_OPTIONS: --no-network-family-autoselection
      SFW_UNKNOWN_HOST_ACTION: ignore
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@6e62935eb0bfeac202d19c425f742dc1dcd88f5d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
        with:
          toolchain: nightly
      # Trusted prebuilt tool; run the dependency audit through Socket on the host.
      - name: Install cargo-deny
        uses: tempoxyz/gh-actions/vendor/taiki-e/install-action@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
        with:
          tool: cargo-deny@0.20.2
          checksum: true
          fallback: none
      - run: cargo deny --all-features --locked check all

  codeql:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: typescript
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{matrix.language}}"

  workflow-validation:
    name: Workflow Validation
    uses: tempoxyz/gh-actions/.github/workflows/scan-github-actions.yml@9b0664503f535261c1d4af0aadf0098bb7cbf26f # main
    permissions:
      actions: read
      contents: read
    secrets:
      STEP_SECURITY_API_KEY: ${{ secrets.STEP_SECURITY_API_KEY }}
    with:
      pinact: true

  ci-success:
    runs-on: ubuntu-latest
    if: always()
    permissions: {}
    needs:
      - rustfmt
      - clippy
      - touch-id-link
      - feature-checks
      - test
      - doctest
      - docs
      - typos
      - deny
      - codeql
      - workflow-validation
    timeout-minutes: 30
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: tempoxyz/gh-actions/actions/check-needs@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
        with:
          jobs: ${{ toJSON(needs) }}

  issue:
    name: Open an issue
    runs-on: ubuntu-latest
    needs: [ci-success]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && failure()
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/JasonEtco/create-an-issue@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_URL: |
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          update_existing: true
          filename: .github/CI_FAILURE_TEMPLATE.md
