name: CI

permissions: {}

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  RUSTC_WRAPPER: "sccache"

jobs:
  cargo-cooldown:
    permissions:
      contents: read
    uses: ./.github/workflows/cargo-cooldown.yml

  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
        with:
          toolchain: nightly
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    needs: cargo-cooldown
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # macOS covers the target-gated `touch-id` code, which the Linux leg
        # never compiles.
        os: ["ubuntu-latest", "macos-latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
        with:
          toolchain: nightly
          components: clippy
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
      - uses: tempoxyz/gh-actions/vendor/Swatinem/rust-cache@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
      - run: cargo clippy --workspace --all-targets --all-features --locked
        env:
          RUSTFLAGS: -Dwarnings

  # The `touch-id` Swift shim must compile and link for both shipped Apple
  # targets, on both the oldest supported toolchain and the latest — the
  # host-arch test leg only ever links one combination. `--no-run` still
  # performs the final binary link (Swift static lib, runtime search paths,
  # framework autolinking), which `cargo check`/`clippy` never exercise, while
  # the x86_64 binaries simply aren't executed on the arm64 runners.
  #
  # The oldest leg pins the documented toolchain floor (Xcode 15.0.1,
  # Swift 5.9 — see `MIN_SWIFT` in crates/wallets/build.rs).
  # If the runner image drops that Xcode, the pin step fails loudly so the
  # floor is re-evaluated instead of silently sliding forward.
  touch-id-link:
    needs: cargo-cooldown
    runs-on: ${{ matrix.toolchain.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    strategy:
      fail-fast: false
      matrix:
        target: ["x86_64-apple-darwin", "aarch64-apple-darwin"]
        toolchain:
          - { xcode: "15.0.1", os: "macos-14" }
          - { xcode: "latest", os: "macos-latest" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pin oldest supported Xcode
        if: matrix.toolchain.xcode != 'latest'
        run: |
          app="/Applications/Xcode_${{ matrix.toolchain.xcode }}.app"
          if [ ! -d "$app" ]; then
            echo "::error::runner image no longer ships Xcode ${{ matrix.toolchain.xcode }}; re-evaluate the documented touch-id toolchain floor (MIN_SWIFT in crates/wallets/build.rs)"
            exit 1
          fi
          echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
      - uses: tempoxyz/gh-actions/vendor/Swatinem/rust-cache@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
        with:
          key: ${{ matrix.toolchain.xcode }}
      - run: swiftc --version
      - name: compile and link touch-id test binaries
        run: |
          artifacts="$RUNNER_TEMP/touch-id-artifacts.json"
          executables="$RUNNER_TEMP/touch-id-executables"
          cargo test -p foundry-wallets --features touch-id --target ${{ matrix.target }} \
            --locked --no-run --message-format=json > "$artifacts"
          jq -r \
            'select(.reason == "compiler-artifact" and .profile.test and .executable != null) | .executable' \
            "$artifacts" > "$executables"
          test -s "$executables"
          while IFS= read -r executable; do
            minos="$(xcrun vtool -show-build "$executable" | awk '$1 == "minos" { print $2; exit }')"
            if [[ ! "$minos" =~ ^11(\.0){0,2}$ ]]; then
              echo "::error file=$executable::expected macOS deployment target 11.0, found ${minos:-none}"
              exit 1
            fi
          done < "$executables"

  feature-checks:
    needs: cargo-cooldown
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
        with:
          toolchain: stable
      - uses: tempoxyz/gh-actions/vendor/taiki-e/install-action@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
        with:
          tool: cargo-hack
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
      - uses: tempoxyz/gh-actions/vendor/Swatinem/rust-cache@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
      - name: cargo hack
        run: cargo hack check --feature-powerset --depth 1 --locked

  test:
    needs: cargo-cooldown
    name: test ${{ matrix.rust }} ${{ matrix.flags }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Keep PR feedback fast by running the test matrix on Linux only.
        # Pushes to main retain cross-platform coverage.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        rust: ["stable", "1.95"]
        flags: ["", "--all-features"]
        exclude:
          # Skip because some features have higher MSRV.
          - rust: "1.95" # MSRV
            flags: "--all-features"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
        with:
          toolchain: ${{ matrix.rust }}
      - name: Install nextest
        uses: tempoxyz/gh-actions/vendor/taiki-e/install-action@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
        with:
          tool: nextest
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
      - uses: tempoxyz/gh-actions/vendor/Swatinem/rust-cache@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
      - name: test
        run: cargo nextest run --workspace --locked ${{ matrix.flags }}

  doctest:
    needs: cargo-cooldown
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
        with:
          toolchain: stable
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
      - uses: tempoxyz/gh-actions/vendor/Swatinem/rust-cache@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
      - run: cargo test --workspace --doc --all-features --locked

  docs:
    needs: cargo-cooldown
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
        with:
          toolchain: nightly
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
      - uses: tempoxyz/gh-actions/vendor/Swatinem/rust-cache@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
      - run: cargo doc --workspace --all-features --no-deps --document-private-items --locked
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings --show-type-layout --generate-link-to-definition --enable-index-page -Zunstable-options

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/actions/typos@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f

  deny:
    needs: cargo-cooldown
    uses: tempoxyz/gh-actions/.github/workflows/rust-lint.yml@3a37d720685503bb084ba723ee981a6c1b120360 # main
    permissions:
      contents: read
    secrets:
      STEP_SECURITY_API_KEY: ${{ secrets.STEP_SECURITY_API_KEY }}
    with:
      run-clippy: false
      run-fmt: false
      run-typos: false
      deny-rust-toolchain: nightly
      deny-flags: --all-features --locked

  codeql:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: typescript
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:${{matrix.language}}"

  workflow-validation:
    name: Workflow Validation
    uses: tempoxyz/gh-actions/.github/workflows/scan-github-actions.yml@9b0664503f535261c1d4af0aadf0098bb7cbf26f # main
    permissions:
      actions: read
      contents: read
    secrets:
      STEP_SECURITY_API_KEY: ${{ secrets.STEP_SECURITY_API_KEY }}
    with:
      pinact: true

  ci-success:
    runs-on: ubuntu-latest
    if: always()
    permissions: {}
    needs:
      - cargo-cooldown
      - rustfmt
      - clippy
      - touch-id-link
      - feature-checks
      - test
      - doctest
      - docs
      - typos
      - deny
      - codeql
      - workflow-validation
    timeout-minutes: 30
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: tempoxyz/gh-actions/actions/check-needs@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
        with:
          jobs: ${{ toJSON(needs) }}

  issue:
    name: Open an issue
    runs-on: ubuntu-latest
    needs: [ci-success]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && failure()
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/JasonEtco/create-an-issue@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_URL: |
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          update_existing: true
          filename: .github/CI_FAILURE_TEMPLATE.md
