name: Cargo dependency cooldown

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Reject newly published crates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --no-network-family-autoselection
      SFW_UNKNOWN_HOST_ACTION: ignore
      RUSTC_WRAPPER: ""
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@7a9d1c1bf11e4804fc617ad0c14ec0a3699599fd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
        with:
          toolchain: stable
      - name: Enforce Cargo dependency cooldown
        uses: tempoxyz/gh-actions/actions/cargo-cooldown@9b0664503f535261c1d4af0aadf0098bb7cbf26f # main
        with:
          cooldown-days: "7"
          # Permit crate-wide exceptions and inline TOML tables in cooldown.toml.
          strict-project-config: false
