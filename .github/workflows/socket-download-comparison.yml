name: Socket download comparison

on:
  pull_request:
    paths:
      - .github/workflows/socket-download-comparison.yml
      - .github/scripts/socket-download-comparison.sh
  workflow_dispatch:

permissions: {}

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      SFW_DEBUG: "true"
      NODE_OPTIONS: --no-network-family-autoselection
      SFW_UNKNOWN_HOST_ACTION: ignore
      SFW_CUSTOM_REGISTRIES: wrap:binaries.soliditylang.org,wrap:raw.githubusercontent.com/nikitastupin/solc,wrap:raw.githubusercontent.com/alloy-rs/solc-builds,wrap:api.etherscan.io,wrap:eth.blockscout.com
      CARGO_HTTP_CHECK_REVOKE: "true"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_TERM_COLOR: never
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@f73cfb98c701a19fba89171988e6f3cc35ff1951
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@134b6c9105953bcf6d50ef0f3f70e31b7a3ec64f
        with:
          toolchain: stable
      - name: Compare downloads with separate empty caches
        shell: bash
        run: bash .github/scripts/socket-download-comparison.sh
      - name: Preserve comparison logs and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: socket-download-comparison
          path: ${{ runner.temp }}/socket-download-comparison
          retention-days: 7
          if-no-files-found: error
