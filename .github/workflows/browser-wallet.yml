name: Browser wallet / Validate

permissions: {}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/browser-wallet.yml
      - crates/wallets/src/wallet_browser/app/assets/**
      - crates/wallets/src/wallet_browser/app/src/**
  pull_request:
    paths:
      - .github/workflows/browser-wallet.yml
      - crates/wallets/src/wallet_browser/app/assets/**
      - crates/wallets/src/wallet_browser/app/src/**

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  browser-wallet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      CI: "true"
      NODE_OPTIONS: --no-network-family-autoselection
      SFW_UNKNOWN_HOST_ACTION: ignore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: crates/wallets/src/wallet_browser/app/src/.nvmrc
      - name: Secure Linux runner
        uses: tempoxyz/gh-actions/actions/secure-runner@5338a3746a2ac2ddd88cbede733c79f907aca3a0
      - name: Set up pnpm
        run: sfw npm install --global pnpm@11.9.0
      - name: Restore pnpm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: crates/wallets/src/wallet_browser/app/src/.nvmrc
          cache: pnpm
          cache-dependency-path: crates/wallets/src/wallet_browser/app/src/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: crates/wallets/src/wallet_browser/app/src
        run: sfw pnpm install --frozen-lockfile
      - name: Check formatting
        working-directory: crates/wallets/src/wallet_browser/app/src
        run: sfw pnpm run fmt:check
      - name: Lint
        working-directory: crates/wallets/src/wallet_browser/app/src
        run: sfw pnpm run lint:check
      - name: Build bundle
        working-directory: crates/wallets/src/wallet_browser/app/src
        run: sfw pnpm run build
      - name: Check generated assets
        run: git diff --exit-code -- crates/wallets/src/wallet_browser/app/assets
