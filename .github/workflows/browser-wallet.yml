name: Browser wallet / Validate

permissions: {}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/browser-wallet.yml
      - crates/wallets/src/wallet_browser/app/assets/**
      - crates/wallets/src/wallet_browser/app/src/**
  pull_request:
    paths:
      - .github/workflows/browser-wallet.yml
      - crates/wallets/src/wallet_browser/app/assets/**
      - crates/wallets/src/wallet_browser/app/src/**

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  browser-wallet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      NODE_OPTIONS: --no-network-family-autoselection
      SFW_UNKNOWN_HOST_ACTION: ignore
      CI: "true"
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@7a9d1c1bf11e4804fc617ad0c14ec0a3699599fd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: crates/wallets/src/wallet_browser/app/src/.nvmrc
      - name: Set up pnpm
        run: npm install --global pnpm@11.9.0 # zizmor: ignore[adhoc-packages] Version-pinned manager bootstrap through Socket; application installs use the frozen lockfile.
      - name: Restore pnpm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: crates/wallets/src/wallet_browser/app/src/.nvmrc
          cache: pnpm
          cache-dependency-path: crates/wallets/src/wallet_browser/app/src/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: crates/wallets/src/wallet_browser/app/src
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        working-directory: crates/wallets/src/wallet_browser/app/src
        run: pnpm run fmt:check
      - name: Lint
        working-directory: crates/wallets/src/wallet_browser/app/src
        run: pnpm run lint:check
      - name: Test
        working-directory: crates/wallets/src/wallet_browser/app/src
        run: pnpm run test
      - name: Build bundle
        working-directory: crates/wallets/src/wallet_browser/app/src
        run: pnpm run build
      - name: Check generated assets
        run: git diff --exit-code -- crates/wallets/src/wallet_browser/app/assets
