name: Browser wallet / Validate

permissions: {}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/browser-wallet.yml
      - crates/wallets/src/wallet_browser/app/assets/**
      - crates/wallets/src/wallet_browser/app/src/**
  pull_request:
    paths:
      - .github/workflows/browser-wallet.yml
      - crates/wallets/src/wallet_browser/app/assets/**
      - crates/wallets/src/wallet_browser/app/src/**

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  browser-wallet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      CI: "true"
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@2ab28a31ae569be9f780c7675b684471060afa40
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: tempoxyz/gh-actions/vendor/pnpm/action-setup@2ab28a31ae569be9f780c7675b684471060afa40
        with:
          version: 11.9.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: crates/wallets/src/wallet_browser/app/src/.nvmrc
          cache: pnpm
          cache-dependency-path: crates/wallets/src/wallet_browser/app/src/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: crates/wallets/src/wallet_browser/app/src
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        working-directory: crates/wallets/src/wallet_browser/app/src
        run: pnpm run fmt:check
      - name: Lint
        working-directory: crates/wallets/src/wallet_browser/app/src
        run: pnpm run lint:check
      - name: Test
        working-directory: crates/wallets/src/wallet_browser/app/src
        run: pnpm run test
      - name: Build bundle
        working-directory: crates/wallets/src/wallet_browser/app/src
        run: pnpm run build
      - name: Check generated assets
        run: git diff --exit-code -- crates/wallets/src/wallet_browser/app/assets
