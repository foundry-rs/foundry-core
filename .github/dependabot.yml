version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    cooldown:
      default-days: 7
    groups:
      ci-weekly:
        patterns:
          - '*'
  - package-ecosystem: cargo
    directory: /
    allow:
      - dependency-type: all
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      cargo-weekly:
        patterns:
          - '*'
  - package-ecosystem: npm
    directory: /crates/wallets/src/wallet_browser/app/src
    ignore:
      - dependency-name: accounts
        versions: ["0.18.5"]
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 1
    groups:
      npm-weekly:
        patterns:
          - '*'
